
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: simtools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-simulators}
      POSTGRES_USER: ${PG_USER:-simtools_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "172.18.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - simtools-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-simtools_user} -d ${PG_DB:-simulators}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: simtools-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-simtools_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-simulators}
    ports:
      - "172.18.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - simtools-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  # Uses network_mode: host to bind to simulator IPs for IRP binary sends
  # Uses SSH to execute Sapro commands (sapcnsl, etc.)
  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER}/simtools-backend:${IMAGE_TAG:-latest}
    container_name: simtools-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PG_HOST=172.18.0.1
      - MONGO_HOST=172.18.0.1
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    image: ghcr.io/${GITHUB_REPO_OWNER}/simtools-frontend:${IMAGE_TAG:-latest}
    container_name: simtools-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - simtools-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SAPRO HTTP Proxy
  # Handles binary responses (device driver JARs, etc.) that SAPRO's XMF cannot serve natively.
  # SAPRO's SA_xml_request_forwarder forwards requests to 127.0.0.1:8888.
  sapro-proxy:
    image: ghcr.io/${GITHUB_REPO_OWNER}/simtools-sapro-proxy:${IMAGE_TAG:-latest}
    container_name: simtools-sapro-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./backend/app/resources/device_drivers:/app/device_drivers:ro
    command: ["python", "-m", "proxy.server", "--port", "8888", "--driver-dir", "/app/device_drivers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl;urllib.request.urlopen('https://localhost:8888/_health',context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: simtools-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - simtools-network

networks:
  simtools-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local

