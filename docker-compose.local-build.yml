version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: simtools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-simulators}
      POSTGRES_USER: ${PG_USER:-simtools_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - simtools-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-simtools_user} -d ${PG_DB:-simulators}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: simtools-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-simtools_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-simulators}
    volumes:
      - mongo-data:/data/db
    networks:
      - simtools-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service - Build from local source
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simtools-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PG_HOST=postgres
      - MONGO_HOST=mongodb
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - simtools-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service - Build from local source
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simtools-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - simtools-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: simtools-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - simtools-network

networks:
  simtools-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local

