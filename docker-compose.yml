version: '3.8'

services:
  backend:
    build: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
  frontend:
    build: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src:ro

